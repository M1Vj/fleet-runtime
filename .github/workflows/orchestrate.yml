name: fleet-orchestrate
run-name: "fleet public orchestrate ${{ github.run_id }}"

on:
  repository_dispatch:
    types:
      - fleet-public
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "public pull request number to inspect"
        required: false
        type: number
      max_agents:
        description: "maximum planned public agent tasks"
        required: false
        default: 15
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fleet-orchestrate-public
  cancel-in-progress: false

env:
  FLEET_DATA_CLASS: public
  FLEET_PUBLIC_OWNER: M1Vj
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
  FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}

jobs:
  plan:
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${FLEET_PUBLIC_TARGET:-${GITHUB_REPOSITORY}}"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: plan public orchestration
        id: plan
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_REPO_INPUT: ${{ steps.public-target.outputs.repository }}
          FLEET_PR_INPUT: ${{ inputs.pr || '' }}
          FLEET_MAX_AGENTS_INPUT: ${{ inputs.max_agents || 15 }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/fleet-public-matrix.json"
          node scripts/orchestrate.mjs plan > "$matrix_file"
          node --input-type=module - "$matrix_file" <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const matrix = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!matrix || typeof matrix !== "object" || !Array.isArray(matrix.include)) throw new Error("public orchestration matrix is invalid");
          for (const task of matrix.include) {
            const repo = String(task.repo || "");
            if (!/^M1Vj\/[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(repo)) throw new Error("public matrix target is not allowlisted");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  execute:
    needs: plan
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FLEET_TASK_REPO: ${{ matrix.repo }}
      FLEET_TASK_PR: ${{ matrix.pr }}
      FLEET_TASK_TYPE: ${{ matrix.type }}
      FLEET_TASK_ROLE: ${{ matrix.role }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ matrix.repo || github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: execute public orchestration task
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_RESULT_FILE: ${{ runner.temp }}/orchestrate-result.json
        run: |
          set -euo pipefail
          node scripts/orchestrate.mjs execute --repo "$FLEET_TASK_REPO" --pr "$FLEET_TASK_PR" --type "$FLEET_TASK_TYPE" --role "$FLEET_TASK_ROLE" --output-file "$FLEET_RESULT_FILE" 1>&2
      - name: consume structured orchestration state
        if: always()
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_RESULT_FILE: ${{ runner.temp }}/orchestrate-result.json
          FLEET_RESULT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          set -euo pipefail
          node --input-type=module - "$FLEET_RESULT_FILE" "$FLEET_RESULT_MANIFEST" <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const effectState = String(result.effectState || "");
          if (!effectState) throw new Error("orchestration result is missing effectState");
          if (typeof result.processSuccess !== "boolean") throw new Error("orchestration result is missing processSuccess");
          if (typeof result.desiredTaskCompleted !== "boolean" || typeof result.semanticStatus !== "string") {
            throw new Error("orchestration result is missing semantic completion fields");
          }
          if (result.semanticStatus === "SUCCESS" && (effectState !== "completed" || result.desiredTaskCompleted !== true)) {
            throw new Error("semantic SUCCESS is not bound to completed durable effect");
          }
          if (result.desiredTaskCompleted === true && result.semanticStatus !== "SUCCESS") {
            throw new Error("desired task completion requires semantic SUCCESS");
          }
          const nonCompleting = new Set(["duplicate", "deferred", "no_op", "dispatched", "awaiting_receipt"]);
          if (nonCompleting.has(String(result.status || "")) && (result.desiredTaskCompleted === true || result.semanticStatus === "SUCCESS")) {
            throw new Error("process outcome cannot claim desired task completion");
          }
          const manifest = JSON.parse(readFileSync(process.argv[3], "utf8"));
          if (manifest.schema !== "fleet-public-artifact-v1" || manifest.dataClass !== "public") {
            throw new Error("public orchestration manifest schema is invalid");
          }
          if (manifest.repository !== process.env.FLEET_PUBLIC_REPOSITORY) {
            throw new Error("public orchestration manifest target mismatch");
          }
          if (manifest.runId !== process.env.GITHUB_RUN_ID) {
            throw new Error("public orchestration manifest run binding mismatch");
          }
          for (const field of ["effectState", "processSuccess", "semanticStatus", "desiredTaskCompleted"]) {
            if (manifest[field] !== result[field]) throw new Error(`public orchestration manifest ${field} mismatch`);
          }
          if (!manifest.checks || manifest.checks.effectState !== result.effectState
            || manifest.checks.processSuccess !== result.processSuccess
            || manifest.checks.semanticStatus !== result.semanticStatus) {
            throw new Error("public orchestration manifest checks mismatch");
          }
          const serialized = JSON.stringify(manifest);
          if (/(?:\/Users\/|\/home\/|\/tmp\/|session-v1-|work-v1-|effect-v1-)/i.test(serialized)) {
            throw new Error("public orchestration manifest contains private provenance");
          }
          NODE
      - name: upload public result manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-orchestration-${{ strategy.job-index }}
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: error
