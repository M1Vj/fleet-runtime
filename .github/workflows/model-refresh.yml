name: fleet-model-refresh
run-name: "fleet model refresh ${{ github.run_id }}"

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      ZEN_MODELS_URL: https://opencode.ai/zen/v1/models
      FLEET_CHAIN_TTL_MS: ${{ vars.FLEET_CHAIN_TTL_MS || '604800000' }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: refresh model chain
        run: node scripts/model-refresh.mjs
      - name: commit chain override to fleet-control
        run: |
          cd state-control
          git config user.name "M1Vj"
          git config user.email "M1Vj@users.noreply.github.com"
          git add state/model-chain.json state/events.jsonl || true
          git diff --cached --quiet && echo "no chain changes" && exit 0
          git commit -m "[fleet] model chain refresh"
          git remote set-url origin "https://x-access-token:${FLEET_GH_TOKEN}@github.com/M1Vj/fleet-control.git"
          git push origin HEAD:main
