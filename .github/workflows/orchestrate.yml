name: fleet-orchestrate
run-name: "fleet orchestrate ${{ github.run_id }}"

on:
  repository_dispatch:
    types:
      - fleet-pr
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to reconcile (owner/name)"
        required: false
        type: string
      pr:
        description: "Pull request number to reconcile"
        required: false
        type: string
      max_agents:
        description: "Maximum planned agent tasks (the fan-out is capped at 15)"
        required: false
        default: "15"
        type: string

permissions:
  contents: read

# Client payloads and manual inputs are untrusted data. They are passed to the
# orchestrator through environment variables for shape/ownership validation.
# The runtime checkout is always the repository default branch, never a PR ref.
concurrency:
  group: >-
    ${{ github.event_name == 'schedule' && 'fleet-reconcile' || format('fleet-pr-{0}-{1}', github.event.client_payload.repo || inputs.repo || github.event.inputs.repo || 'all', github.event.client_payload.pr || inputs.pr || github.event.inputs.pr || 'all') }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fleet-orchestrate-history-writer
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      FLEET_EVENT_NAME: ${{ github.event_name }}
      FLEET_EVENT_ACTION: ${{ github.event.action || github.event.event_type || '' }}
      FLEET_EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      FLEET_REPO_INPUT: ${{ inputs.repo || github.event.inputs.repo || '' }}
      FLEET_PR_INPUT: ${{ inputs.pr || github.event.inputs.pr || '' }}
      FLEET_MAX_AGENTS_INPUT: ${{ inputs.max_agents || github.event.inputs.max_agents || '15' }}
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private fleet-control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: plan orchestration matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/fleet-orchestration-matrix.json"
          node scripts/orchestrate.mjs plan > "$matrix_file"
          node - "$matrix_file" <<'NODE'
          const fs = require("node:fs");
          const matrixPath = process.argv[2];
          const matrix = JSON.parse(fs.readFileSync(matrixPath, "utf8"));
          if (!matrix || typeof matrix !== "object" || !Array.isArray(matrix.include)) {
            throw new Error("orchestrate plan must output a JSON matrix with an include array");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE
      - name: persist orchestration history
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { safeCommitState } from "./scripts/lib/util.mjs";
          const outcome = safeCommitState(
            "state-control",
            ["state/orchestrate-history.jsonl"],
            "[fleet] persist orchestration history",
            { name: "M1Vj", noreply: "M1Vj@users.noreply.github.com" },
            process.env,
          );
          console.log(`orchestration history state=${outcome}`);
          NODE

  execute:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FLEET_EVENT_NAME: ${{ github.event_name }}
      FLEET_EVENT_ACTION: ${{ github.event.action || github.event.event_type || '' }}
      FLEET_EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      FLEET_REPO_INPUT: ${{ inputs.repo || github.event.inputs.repo || '' }}
      FLEET_PR_INPUT: ${{ inputs.pr || github.event.inputs.pr || '' }}
      FLEET_MAX_AGENTS_INPUT: ${{ inputs.max_agents || github.event.inputs.max_agents || '15' }}
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_OPENCODE_AUTH: ${{ secrets.FLEET_OPENCODE_AUTH }}
      FLEET_OPENCODE_AUTH_2: ${{ secrets.FLEET_OPENCODE_AUTH_2 }}
      FLEET_OPENCODE_AUTH_3: ${{ secrets.FLEET_OPENCODE_AUTH_3 }}
      FLEET_OPENCODE_AUTH_4: ${{ secrets.FLEET_OPENCODE_AUTH_4 }}
      FLEET_OPENCODE_AUTH_5: ${{ secrets.FLEET_OPENCODE_AUTH_5 }}
      FLEET_OPENCODE_AUTH_6: ${{ secrets.FLEET_OPENCODE_AUTH_6 }}
      FLEET_OPENCODE_AUTH_7: ${{ secrets.FLEET_OPENCODE_AUTH_7 }}
      FLEET_OPENCODE_AUTH_8: ${{ secrets.FLEET_OPENCODE_AUTH_8 }}
      FLEET_OPENCODE_AUTH_9: ${{ secrets.FLEET_OPENCODE_AUTH_9 }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      FLEET_TASK_REPO: ${{ matrix.repo }}
      FLEET_TASK_PR: ${{ matrix.pr }}
      FLEET_TASK_TYPE: ${{ matrix.type }}
      FLEET_TASK_ROLE: ${{ matrix.role }}
      FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-task-results
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private fleet-control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: execute orchestration task
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orchestrate.mjs execute \
            --repo "$FLEET_TASK_REPO" \
            --pr "$FLEET_TASK_PR" \
            --type "$FLEET_TASK_TYPE" \
            --role "$FLEET_TASK_ROLE"
      # GitHub expressions do not provide a replace() helper for slash-safe
      # matrix names. The matrix job index is unique within this fan-out, and
      # orchestrate writes task results below FLEET_ARTIFACT_DIR.
      - name: upload task result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-task-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/fleet-task-results
          if-no-files-found: warn
          retention-days: 7
