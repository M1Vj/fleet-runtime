name: fleet-retro
run-name: "fleet retro ${{ github.run_id }}"

on:
  schedule:
    - cron: "19 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_OPENCODE_AUTH: ${{ secrets.FLEET_OPENCODE_AUTH }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
    steps:
      - name: checkout runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@v4
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: retrospective sub-agent
        run: FLEET_RETRO_MODE=propose node scripts/retro.mjs
