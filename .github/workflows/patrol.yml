name: fleet-patrol
run-name: "fleet patrol ${{ github.run_id }}"

on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "force run even if disabled guard"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      FLEET_OPENCODE_AUTH: ${{ secrets.FLEET_OPENCODE_AUTH }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@v4
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: patrol
        run: node scripts/patrol.mjs
      - name: dump opencode logs on failure
        if: failure()
        run: tail -n 60 $HOME/.local/share/opencode/log/*.log 2>/dev/null || true
