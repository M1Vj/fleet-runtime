name: fleet-improve
run-name: "fleet improve ${{ github.run_id }}"

on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch:
    inputs:
      top_k:
        description: "how many public repositories to improve"
        type: number
        default: 2

concurrency:
  group: fleet-improve-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLEET_DATA_CLASS: public
  FLEET_PUBLIC_OWNER: M1Vj
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
  FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}

jobs:
  pick:
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      repository: ${{ steps.pick.outputs.repository }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${FLEET_PUBLIC_TARGET:-${GITHUB_REPOSITORY}}"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$target" != *$'\n'* && "$target" != *$'\r'* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: pick public targets
        id: pick
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_TOP_K: ${{ inputs.top_k || 2 }}
          FLEET_IMPROVE_MODE: pick
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-artifacts
        run: node scripts/improve.mjs
      - name: upload public selection manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-selection
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  research:
    needs: pick
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    env:
      FLEET_REPO: ${{ matrix.repo }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ matrix.repo }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: research public target
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_IMPROVE_MODE: research
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-artifacts
        run: node scripts/improve.mjs
      - name: upload public research manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-research-${{ strategy.job-index }}
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  plan:
    needs: [pick, research]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      hasanalysis: ${{ steps.plan.outputs.hasanalysis }}
      implmatrix: ${{ steps.plan.outputs.implmatrix }}
      reviewmatrix: ${{ steps.plan.outputs.reviewmatrix }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ needs.pick.outputs.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public research manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: public-research-*
          path: ${{ runner.temp }}/fleet-public-research
          merge-multiple: false
        continue-on-error: true
      - name: plan public improvements
        id: plan
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_IMPROVE_MODE: plan
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-research
        run: node scripts/improve.mjs
      - name: upload public plan manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-plan
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  implement:
    needs: plan
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && needs.plan.result == 'success' && needs.plan.outputs.hasanalysis == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.implmatrix) }}
    env:
      FLEET_REPO: ${{ matrix.repo }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ matrix.repo }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: implement public result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_IMPROVE_MODE: implement
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-artifacts
        run: node scripts/improve.mjs
      - name: upload public implementation manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-implementation-${{ strategy.job-index }}
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  review:
    needs: [plan, implement]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && always() && needs.plan.result == 'success' && needs.plan.outputs.hasanalysis == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.reviewmatrix) }}
    env:
      FLEET_REPO: ${{ matrix.repo }}
      FLEET_LENS: ${{ matrix.lens }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ matrix.repo }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public research manifests for review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: public-research-*
          path: ${{ runner.temp }}/fleet-public-research
          merge-multiple: false
        continue-on-error: true
      - name: review public result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_IMPROVE_MODE: review
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-artifacts
          FLEET_PUBLIC_RESEARCH_DIR: ${{ runner.temp }}/fleet-public-research
        run: node scripts/improve.mjs
      - name: upload public review manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-review-${{ strategy.job-index }}
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  finalize:
    needs: [pick, research, plan, implement, review]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ needs.pick.outputs.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: download public improve manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: public-*
          path: ${{ runner.temp }}/fleet-public-receipts
          merge-multiple: false
        continue-on-error: true
      - name: finalize public result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_IMPROVE_MODE: finalize
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-receipts
          FLEET_IMPROVE_PICK_RESULT: ${{ needs.pick.result }}
          FLEET_IMPROVE_RESEARCH_RESULT: ${{ needs.research.result }}
          FLEET_IMPROVE_PLAN_RESULT: ${{ needs.plan.result }}
          FLEET_IMPROVE_IMPLEMENT_RESULT: ${{ needs.implement.result }}
          FLEET_IMPROVE_REVIEW_RESULT: ${{ needs.review.result }}
        run: node scripts/improve.mjs
      - name: upload public improve receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-improve-receipt
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: error
