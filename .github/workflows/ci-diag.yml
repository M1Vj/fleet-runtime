name: ci-diag
run-name: "opencode CI diagnostic ${{ github.run_id }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLEET_DATA_CLASS: public
      FLEET_MODEL_PRIMARY: ${{ vars.FLEET_MODEL_PRIMARY || 'opencode/muse-spark-1.3-contributor-free' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install opencode
        run: npm install -g opencode-ai@1.18.30
      - name: environment facts
        run: |
          uname -a
          node -v
          which opencode
          file "$(readlink -f "$(which opencode)")" || true
      - name: anonymous model probe
        continue-on-error: true
        run: |
          probe_status=failed
          if timeout 90 opencode run --format json -m "${FLEET_MODEL_PRIMARY:-opencode/muse-spark-1.3-contributor-free}" "Reply DIAG1" > o1.txt 2> e1.txt; then
            probe_status=ok
          fi
          printf 'probe=%s\n' "$probe_status"
          rm -f o1.txt e1.txt
      - name: public catalog probe
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 15 https://opencode.ai/zen/v1/models -o /tmp/public-models.json || true
          test ! -e /tmp/public-models.json || head -c 200 /tmp/public-models.json
          printf '\n'
          curl --fail --silent --show-error --max-time 15 https://models.dev/api.json -o /tmp/public-models-dev.json || true
