name: fleet-deep
run-name: "fleet deep ${{ github.run_id }}"

on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "max parallel sub-agents"
        type: string
        default: "4"

concurrency:
  group: fleet-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
    steps:
      - name: sanitize workers input
        env:
          WORKERS_INPUT: ${{ github.event.inputs.workers }}
        run: |
          case "$WORKERS_INPUT" in
            ''|*[!0-9]*) workers=4 ;;
            *) workers="$WORKERS_INPUT" ;;
          esac
          printf 'FLEET_MAX_WORKERS=%s\n' "$workers" >> "$GITHUB_ENV"
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: plan tasks
        id: plan
        run: |
          MAXW="$FLEET_MAX_WORKERS"
          TASKS=$(node -e '
            const fs=require("fs");
            const max=parseInt(process.argv[1])||3;
            const qp=(process.env.FLEET_STATE_ROOT||".")+"/state/queue.jsonl";
            const rows=fs.existsSync(qp)?fs.readFileSync(qp,"utf8").split("\n").filter(Boolean)
              .map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean):[];
            const now=Date.now();
            const claimable=rows.filter(t=>t.status==="pending"||(t.status==="in_progress"&&t.updatedUtc&&now-new Date(t.updatedUtc).getTime()>40*60*1000&&(t.attempts||0)<3));
            const picked=claimable.slice(0,max).map(t=>({repo:t.repo,kind:t.kind}));
            console.log(JSON.stringify({worker:picked.length?picked:[{repo:"",kind:"none"}]}));
          ' "$MAXW")
          echo "matrix=$TASKS" >> "$GITHUB_OUTPUT"

  analyze:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
      FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
      FLEET_GEMINI_MODEL: ${{ vars.FLEET_GEMINI_MODEL }}
      FLEET_PROVIDER_HEALTH_JSON: ${{ vars.FLEET_PROVIDER_HEALTH_JSON }}
      FLEET_NVIDIA_ENABLE: ${{ vars.FLEET_NVIDIA_ENABLE }}
      FLEET_REPO: ${{ matrix.worker.repo || matrix.repo }}
      FLEET_KIND: ${{ matrix.worker.kind || matrix.kind }}
    steps:
      - name: skip-empty
        if: ${{ env.FLEET_REPO == '' }}
        run: echo "no claimable tasks" && exit 0
      - name: checkout
        if: ${{ env.FLEET_REPO != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        if: ${{ env.FLEET_REPO != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        if: ${{ env.FLEET_REPO != '' }}
        run: npm install -g opencode-ai@1.18.21
      - name: verify public target for free-provider credentials
        id: public
        if: ${{ env.FLEET_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          echo "verified=false" >> "$GITHUB_OUTPUT"
          full_name=$(gh api "repos/$FLEET_REPO" --jq '.full_name')
          visibility=$(gh api "repos/$FLEET_REPO" --jq 'if .private == false and .visibility == "public" then "public" else "restricted" end')
          if [ "$full_name" = "$FLEET_REPO" ] && [ "$visibility" = "public" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          fi
      - name: analyze as sub-agent
        if: ${{ env.FLEET_REPO != '' }}
        env:
          GEMINI_API_KEY_1: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_1 || '' }}
          GEMINI_API_KEY_2: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_2 || '' }}
          GEMINI_API_KEY_1_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_1_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_2_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_2_QUOTA_GROUP || '' }}
          OPENROUTER_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          NVIDIA_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.NVIDIA_API_KEY || '' }}
        run: |
          mkdir -p artifacts
          FLEET_ARTIFACT_DIR=artifacts node scripts/deep.mjs
      - name: dump opencode logs on failure
        if: failure()
        run: tail -n 60 $HOME/.local/share/opencode/log/*.log 2>/dev/null || true
      - name: upload findings
        if: ${{ env.FLEET_REPO != '' && hashFiles('artifacts/report-*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reports-${{ strategy.job-index }}
          path: artifacts/

  commit:
    needs: [plan, analyze]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
    steps:
      - name: sanitize workers input
        env:
          WORKERS_INPUT: ${{ github.event.inputs.workers }}
        run: |
          case "$WORKERS_INPUT" in
            ''|*[!0-9]*) workers=4 ;;
            *) workers="$WORKERS_INPUT" ;;
          esac
          printf 'FLEET_MAX_WORKERS=%s\n' "$workers" >> "$GITHUB_ENV"
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: download all findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: reports-*
          merge-multiple: true
          path: artifacts
        continue-on-error: true
      - name: ensure artifacts dir
        run: mkdir -p artifacts
      - name: commit reports as M1Vj
        run: FLEET_ARTIFACT_DIR=artifacts FLEET_DEEP_MODE=commit node scripts/deep.mjs
