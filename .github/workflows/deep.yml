name: fleet-deep
run-name: "fleet deep ${{ github.run_id }}"

on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "max parallel sub-agents"
        type: string
        default: "6"

concurrency:
  group: fleet-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: sanitize workers input
        env:
          FLEET_WORKERS_INPUT: ${{ github.event.inputs.workers || '' }}
        run: |
          FLEET_MAX_WORKERS=$(node --input-type=module <<'NODE'
          import { sanitizeMaxWorkers } from "./scripts/deep.mjs";
          process.stdout.write(String(sanitizeMaxWorkers(process.env.FLEET_WORKERS_INPUT)));
          NODE
          )
          echo "FLEET_MAX_WORKERS=$FLEET_MAX_WORKERS" >> "$GITHUB_ENV"
      - name: plan tasks
        id: plan
        run: |
          FLEET_DEEP_MODE=plan node scripts/deep.mjs >> "$GITHUB_OUTPUT"

  analyze:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      FLEET_OPENCODE_AUTH: ${{ secrets.FLEET_OPENCODE_AUTH }}
      FLEET_OPENCODE_AUTH_2: ${{ secrets.FLEET_OPENCODE_AUTH_2 }}
      FLEET_OPENCODE_AUTH_3: ${{ secrets.FLEET_OPENCODE_AUTH_3 }}
      FLEET_OPENCODE_AUTH_4: ${{ secrets.FLEET_OPENCODE_AUTH_4 }}
      FLEET_OPENCODE_AUTH_5: ${{ secrets.FLEET_OPENCODE_AUTH_5 }}
      FLEET_OPENCODE_AUTH_6: ${{ secrets.FLEET_OPENCODE_AUTH_6 }}
      FLEET_OPENCODE_AUTH_7: ${{ secrets.FLEET_OPENCODE_AUTH_7 }}
      FLEET_OPENCODE_AUTH_8: ${{ secrets.FLEET_OPENCODE_AUTH_8 }}
      FLEET_OPENCODE_AUTH_9: ${{ secrets.FLEET_OPENCODE_AUTH_9 }}
      FLEET_REPO: ${{ matrix.worker.repo || matrix.repo }}
      FLEET_KIND: ${{ matrix.worker.kind || matrix.kind }}
      FLEET_TASK_ID: ${{ matrix.worker.taskId || matrix.taskId }}
      FLEET_CLAIM_RUN_ID: ${{ matrix.worker.claimRunId || matrix.claimRunId }}
      FLEET_CLAIM_ATTEMPT: ${{ matrix.worker.claimAttempt || matrix.claimAttempt }}
    steps:
      - name: skip-empty
        if: ${{ env.FLEET_REPO == '' }}
        run: echo "no claimable tasks" && exit 0
      - name: checkout
        if: ${{ env.FLEET_REPO != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        if: ${{ env.FLEET_REPO != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        if: ${{ env.FLEET_REPO != '' }}
        run: npm install -g opencode-ai@1.18.21
      - name: analyze as sub-agent
        if: ${{ env.FLEET_REPO != '' }}
        run: |
          mkdir -p artifacts
          FLEET_ARTIFACT_DIR=artifacts node scripts/deep.mjs
      - name: dump opencode logs on failure
        if: failure()
        run: tail -n 60 $HOME/.local/share/opencode/log/*.log 2>/dev/null || true
      - name: upload findings
        if: ${{ env.FLEET_REPO != '' && hashFiles('artifacts/report-*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reports-${{ strategy.job-index }}
          path: artifacts/

  commit:
    needs: [plan, analyze]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: fleet-state-writer
      cancel-in-progress: false
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      FLEET_ANALYZE_RESULT: ${{ needs.analyze.result }}
      FLEET_PLAN_MATRIX: ${{ needs.plan.outputs.matrix }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: download all findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: reports-*
          merge-multiple: true
          path: artifacts
        continue-on-error: true
      - name: ensure artifacts dir
        run: mkdir -p artifacts
      - name: commit reports as M1Vj
        run: FLEET_ARTIFACT_DIR=artifacts FLEET_DEEP_MODE=commit node scripts/deep.mjs
