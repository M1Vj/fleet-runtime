name: fleet-improve
run-name: "fleet improve ${{ github.run_id }}"

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      top_k:
        description: "how many top repos to improve"
        type: string
        default: "2"

concurrency:
  group: fleet-improve
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      FLEET_TOP_K: ${{ github.event.inputs.top_k || '3' }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: pick targets
        id: pick
        run: |
          OUT=$(FLEET_IMPROVE_MODE=pick node scripts/improve.mjs)
          echo "$OUT"
          MATRIX=$(echo "$OUT" | grep '^IMPROVE_MATRIX=' | sed 's/^IMPROVE_MATRIX=//')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  research:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
      FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
      FLEET_GEMINI_MODEL: ${{ vars.FLEET_GEMINI_MODEL }}
      FLEET_PROVIDER_HEALTH_JSON: ${{ vars.FLEET_PROVIDER_HEALTH_JSON }}
      FLEET_NVIDIA_ENABLE: ${{ vars.FLEET_NVIDIA_ENABLE }}
      FLEET_REPO: ${{ matrix.repo }}
    steps:
      - name: checkout fleet repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: verify public target for free-provider credentials
        id: public
        env:
          GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          echo "verified=false" >> "$GITHUB_OUTPUT"
          full_name=$(gh api "repos/$FLEET_REPO" --jq '.full_name')
          visibility=$(gh api "repos/$FLEET_REPO" --jq 'if .private == false and .visibility == "public" then "public" else "restricted" end')
          if [ "$full_name" = "$FLEET_REPO" ] && [ "$visibility" = "public" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          fi
      - name: research sub-agent
        env:
          GEMINI_API_KEY_1: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_1 || '' }}
          GEMINI_API_KEY_2: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_2 || '' }}
          GEMINI_API_KEY_3: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_3 || '' }}
          GEMINI_API_KEY_4: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_4 || '' }}
          GEMINI_API_KEY_5: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_5 || '' }}
          GEMINI_API_KEY_6: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_6 || '' }}
          GEMINI_API_KEY_1_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_1_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_2_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_2_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_3_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_3_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_4_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_4_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_5_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_5_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_6_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_6_QUOTA_GROUP || '' }}
          OPENROUTER_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          NVIDIA_API_KEY_1: ${{ steps.public.outputs.verified == 'true' && secrets.NVIDIA_API_KEY_1 || '' }}
          NVIDIA_API_KEY_2: ${{ steps.public.outputs.verified == 'true' && secrets.NVIDIA_API_KEY_2 || '' }}
          GROQ_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.GROQ_API_KEY || '' }}
          AI_GATEWAY_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.VERCEL_AI_GATEWAY_API_KEY || '' }}
          CLOUDFLARE_API_TOKEN: ${{ steps.public.outputs.verified == 'true' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.public.outputs.verified == 'true' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          FLEET_GROQ_ENABLE: ${{ vars.FLEET_GROQ_ENABLE }}
          FLEET_VERCEL_AI_ENABLE: ${{ vars.FLEET_VERCEL_AI_ENABLE }}
          FLEET_CLOUDFLARE_AI_ENABLE: ${{ vars.FLEET_CLOUDFLARE_AI_ENABLE }}
          FLEET_OPENROUTER_ENABLE: ${{ vars.FLEET_OPENROUTER_ENABLE }}
        run: |
          mkdir -p artifacts
          FLEET_IMPROVE_MODE=research FLEET_ARTIFACT_DIR=artifacts node scripts/improve.mjs
      - name: dump opencode logs on failure
        if: failure()
        run: tail -n 60 $HOME/.local/share/opencode/log/*.log 2>/dev/null || true
      - name: export bounded provider cooldown state
        if: always()
        env:
          FLEET_PROVIDER_HEALTH_ARTIFACT_DIR: ${{ github.workspace }}/provider-health-artifacts
          FLEET_PROVIDER_HEALTH_ARTIFACT_ID: improve-research-${{ github.run_id }}-${{ strategy.job-index }}
        run: node scripts/provider-health-artifact.mjs export
      - name: upload provider cooldown state
        if: ${{ always() && hashFiles('provider-health-artifacts/provider-health-*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-health-improve-research-${{ strategy.job-index }}
          path: provider-health-artifacts/provider-health-*.json
          retention-days: 1
      - name: upload ideas
        if: hashFiles('artifacts/ideas-*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ideas-${{ strategy.job-index }}
          path: artifacts/

  plan:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      implmatrix: ${{ steps.plan.outputs.implmatrix }}
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
      FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
      FLEET_GEMINI_MODEL: ${{ vars.FLEET_GEMINI_MODEL }}
      FLEET_PROVIDER_HEALTH_JSON: ${{ vars.FLEET_PROVIDER_HEALTH_JSON }}
      FLEET_NVIDIA_ENABLE: ${{ vars.FLEET_NVIDIA_ENABLE }}
    steps:
      - name: checkout fleet repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: download ideas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ideas-*
          merge-multiple: true
          path: artifacts
      - name: download provider cooldown state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: provider-health-improve-research-*
          merge-multiple: true
          path: provider-health-artifacts
        continue-on-error: true
      - name: import bounded provider cooldown state
        env:
          FLEET_PROVIDER_HEALTH_ARTIFACT_DIR: ${{ github.workspace }}/provider-health-artifacts
        run: node scripts/provider-health-artifact.mjs import
      - name: verify all public plan targets for free-provider credentials
        id: public
        env:
          GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          echo "verified=false" >> "$GITHUB_OUTPUT"
          node <<'NODE' > public-targets.txt
          const fs = require("fs");
          const files = fs.existsSync("artifacts")
            ? fs.readdirSync("artifacts").filter((name) => name.startsWith("ideas-") && name.endsWith(".json"))
            : [];
          const repos = [...new Set(files.map((name) => JSON.parse(fs.readFileSync(`artifacts/${name}`, "utf8")).repo))];
          if (repos.some((repo) => !/^M1Vj\/[A-Za-z0-9._-]+$/.test(repo))) process.exit(2);
          if (repos.length > 0) process.stdout.write(`${repos.join("\n")}\n`);
          NODE
          [ -s public-targets.txt ] || exit 0
          while IFS= read -r repo; do
            full_name=$(gh api "repos/$repo" --jq '.full_name')
            visibility=$(gh api "repos/$repo" --jq 'if .private == false and .visibility == "public" then "public" else "restricted" end')
            [ "$full_name" = "$repo" ] && [ "$visibility" = "public" ] || exit 0
          done < public-targets.txt
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: plan sub-agent
        id: plan
        env:
          GEMINI_API_KEY_1: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_1 || '' }}
          GEMINI_API_KEY_2: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_2 || '' }}
          GEMINI_API_KEY_3: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_3 || '' }}
          GEMINI_API_KEY_4: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_4 || '' }}
          GEMINI_API_KEY_5: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_5 || '' }}
          GEMINI_API_KEY_6: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_6 || '' }}
          GEMINI_API_KEY_1_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_1_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_2_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_2_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_3_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_3_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_4_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_4_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_5_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_5_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_6_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_6_QUOTA_GROUP || '' }}
          OPENROUTER_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          NVIDIA_API_KEY_1: ${{ steps.public.outputs.verified == 'true' && secrets.NVIDIA_API_KEY_1 || '' }}
          NVIDIA_API_KEY_2: ${{ steps.public.outputs.verified == 'true' && secrets.NVIDIA_API_KEY_2 || '' }}
          GROQ_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.GROQ_API_KEY || '' }}
          AI_GATEWAY_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.VERCEL_AI_GATEWAY_API_KEY || '' }}
          CLOUDFLARE_API_TOKEN: ${{ steps.public.outputs.verified == 'true' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.public.outputs.verified == 'true' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          FLEET_GROQ_ENABLE: ${{ vars.FLEET_GROQ_ENABLE }}
          FLEET_VERCEL_AI_ENABLE: ${{ vars.FLEET_VERCEL_AI_ENABLE }}
          FLEET_CLOUDFLARE_AI_ENABLE: ${{ vars.FLEET_CLOUDFLARE_AI_ENABLE }}
          FLEET_OPENROUTER_ENABLE: ${{ vars.FLEET_OPENROUTER_ENABLE }}
        run: |
          echo 'implmatrix={"repo":[]}' >> "$GITHUB_OUTPUT"
          set +e
          FLEET_IMPROVE_MODE=plan FLEET_ARTIFACT_DIR=artifacts node scripts/improve.mjs 2>&1 | tee plan-run.log
          CODE=${PIPESTATUS[0]}
          set -e
          cat plan-run.log
          REPOS=$(node -e '
            const fs=require("fs");
            const files=fs.existsSync("artifacts")?fs.readdirSync("artifacts").filter(f=>f.startsWith("plan-")&&f.endsWith(".json")):[];
            const repos=files.map(f=>JSON.parse(fs.readFileSync("artifacts/"+f,"utf8")).repo);
            console.log(JSON.stringify({repo:repos}));
          ')
          echo "implmatrix=$REPOS" >> "$GITHUB_OUTPUT"
          exit $CODE
      - name: upload plans
        if: hashFiles('artifacts/plan-*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plans
          path: artifacts/plan-*.json
      - name: export bounded provider cooldown state
        if: always()
        env:
          FLEET_PROVIDER_HEALTH_ARTIFACT_DIR: ${{ github.workspace }}/provider-health-artifacts-out
          FLEET_PROVIDER_HEALTH_ARTIFACT_ID: improve-plan-${{ github.run_id }}
        run: node scripts/provider-health-artifact.mjs export
      - name: upload provider cooldown state
        if: ${{ always() && hashFiles('provider-health-artifacts-out/provider-health-*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-health-improve-plan
          path: provider-health-artifacts-out/provider-health-*.json
          retention-days: 1

  implement:
    needs: [plan]
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
    steps:
      - name: checkout fleet repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: download plans
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plans
          path: artifacts
      - name: implement draft PRs as M1Vj
        run: |
          set +e
          RC=0
          for f in artifacts/plan-*.json; do
            [ -e "$f" ] || continue
            REPO=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).repo' "$f")
            echo "== implementing $REPO"
            FLEET_IMPROVE_MODE=implement FLEET_ARTIFACT_DIR=artifacts FLEET_REPO="$REPO" node scripts/improve.mjs || { echo "implement failed for $REPO"; RC=1; }
          done
          exit $RC
      - name: upload pr metas
        if: hashFiles('artifacts/prmeta-*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prmeta-all
          path: artifacts/prmeta-*.json

  review:
    needs: [plan, implement]
    if: ${{ always() && needs.implement.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lens: [correctness, redteam, standards]
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
      FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
      FLEET_GEMINI_MODEL: ${{ vars.FLEET_GEMINI_MODEL }}
      FLEET_PROVIDER_HEALTH_JSON: ${{ vars.FLEET_PROVIDER_HEALTH_JSON }}
      FLEET_NVIDIA_ENABLE: ${{ vars.FLEET_NVIDIA_ENABLE }}
      FLEET_LENS: ${{ matrix.lens }}
    steps:
      - name: checkout fleet repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: download plans and pr metas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "{plans,prmeta-all}"
          merge-multiple: true
          path: artifacts
      - name: download provider cooldown state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: provider-health-improve-plan
          merge-multiple: true
          path: provider-health-artifacts
        continue-on-error: true
      - name: import bounded provider cooldown state
        env:
          FLEET_PROVIDER_HEALTH_ARTIFACT_DIR: ${{ github.workspace }}/provider-health-artifacts
        run: node scripts/provider-health-artifact.mjs import
      - name: verify all public review targets for free-provider credentials
        id: public
        env:
          GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          echo "verified=false" >> "$GITHUB_OUTPUT"
          node <<'NODE' > public-targets.txt
          const fs = require("fs");
          const files = fs.existsSync("artifacts")
            ? fs.readdirSync("artifacts").filter((name) => name.startsWith("prmeta-") && name.endsWith(".json"))
            : [];
          const repos = [...new Set(files.map((name) => JSON.parse(fs.readFileSync(`artifacts/${name}`, "utf8")).repo))];
          if (repos.some((repo) => !/^M1Vj\/[A-Za-z0-9._-]+$/.test(repo))) process.exit(2);
          if (repos.length > 0) process.stdout.write(`${repos.join("\n")}\n`);
          NODE
          [ -s public-targets.txt ] || exit 0
          while IFS= read -r repo; do
            full_name=$(gh api "repos/$repo" --jq '.full_name')
            visibility=$(gh api "repos/$repo" --jq 'if .private == false and .visibility == "public" then "public" else "restricted" end')
            [ "$full_name" = "$repo" ] && [ "$visibility" = "public" ] || exit 0
          done < public-targets.txt
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: review sub-agents
        env:
          GEMINI_API_KEY_1: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_1 || '' }}
          GEMINI_API_KEY_2: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_2 || '' }}
          GEMINI_API_KEY_3: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_3 || '' }}
          GEMINI_API_KEY_4: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_4 || '' }}
          GEMINI_API_KEY_5: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_5 || '' }}
          GEMINI_API_KEY_6: ${{ steps.public.outputs.verified == 'true' && secrets.GEMINI_API_KEY_6 || '' }}
          GEMINI_API_KEY_1_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_1_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_2_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_2_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_3_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_3_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_4_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_4_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_5_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_5_QUOTA_GROUP || '' }}
          GEMINI_API_KEY_6_QUOTA_GROUP: ${{ steps.public.outputs.verified == 'true' && vars.GEMINI_API_KEY_6_QUOTA_GROUP || '' }}
          OPENROUTER_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          NVIDIA_API_KEY_1: ${{ steps.public.outputs.verified == 'true' && secrets.NVIDIA_API_KEY_1 || '' }}
          NVIDIA_API_KEY_2: ${{ steps.public.outputs.verified == 'true' && secrets.NVIDIA_API_KEY_2 || '' }}
          GROQ_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.GROQ_API_KEY || '' }}
          AI_GATEWAY_API_KEY: ${{ steps.public.outputs.verified == 'true' && secrets.VERCEL_AI_GATEWAY_API_KEY || '' }}
          CLOUDFLARE_API_TOKEN: ${{ steps.public.outputs.verified == 'true' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.public.outputs.verified == 'true' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          FLEET_GROQ_ENABLE: ${{ vars.FLEET_GROQ_ENABLE }}
          FLEET_VERCEL_AI_ENABLE: ${{ vars.FLEET_VERCEL_AI_ENABLE }}
          FLEET_CLOUDFLARE_AI_ENABLE: ${{ vars.FLEET_CLOUDFLARE_AI_ENABLE }}
          FLEET_OPENROUTER_ENABLE: ${{ vars.FLEET_OPENROUTER_ENABLE }}
        run: |
          mkdir -p reviews
          FLEET_IMPROVE_MODE=review FLEET_ARTIFACT_DIR=artifacts node scripts/improve.mjs
      - name: upload reviews
        if: hashFiles('reviews/*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviews-${{ matrix.lens }}
          path: reviews/
      - name: export bounded provider cooldown state
        if: always()
        env:
          FLEET_PROVIDER_HEALTH_ARTIFACT_DIR: ${{ github.workspace }}/provider-health-artifacts-out
          FLEET_PROVIDER_HEALTH_ARTIFACT_ID: improve-review-${{ github.run_id }}-${{ matrix.lens }}
        run: node scripts/provider-health-artifact.mjs export
      - name: upload provider cooldown state
        if: ${{ always() && hashFiles('provider-health-artifacts-out/provider-health-*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-health-improve-review-${{ matrix.lens }}
          path: provider-health-artifacts-out/provider-health-*.json
          retention-days: 1

  finalize:
    needs: [plan, review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
    steps:
      - name: checkout fleet repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "{prmeta-*,reviews-*}"
          merge-multiple: true
          path: alldownloaded
      - name: download provider cooldown state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: provider-health-improve-*
          merge-multiple: true
          path: provider-health-artifacts
        continue-on-error: true
      - name: import bounded provider cooldown state
        env:
          FLEET_PROVIDER_HEALTH_ARTIFACT_DIR: ${{ github.workspace }}/provider-health-artifacts
        run: node scripts/provider-health-artifact.mjs import
      - name: post reviews as M1Vj and record state
        run: |
          mkdir -p split/prmeta split/reviews
          cp alldownloaded/prmeta-*.json split/prmeta/ 2>/dev/null || true
          cp alldownloaded/review-*.json split/reviews/ 2>/dev/null || true
          FLEET_IMPROVE_MODE=finalize FLEET_ARTIFACT_DIR=split/prmeta FLEET_REVIEW_DIR=split/reviews node scripts/improve.mjs
