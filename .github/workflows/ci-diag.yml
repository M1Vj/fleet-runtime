name: ci-diag
run-name: "opencode CI diagnostic ${{ github.run_id }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLEET_DATA_CLASS: public
      FLEET_MODEL_PRIMARY: ${{ vars.FLEET_MODEL_PRIMARY || 'opencode/muse-spark-1.3-contributor-free' }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install opencode
        run: npm install -g opencode-ai@1.18.30
      - name: environment facts
        run: |
          uname -a
          node -v
          which opencode
          file "$(readlink -f "$(which opencode)")" || true
      - name: anonymous model probe
        continue-on-error: true
        run: |
          timeout 90 opencode run --format json -m "${FLEET_MODEL_PRIMARY:-opencode/muse-spark-1.3-contributor-free}" "Reply DIAG1" > o1.txt 2> e1.txt || true
          printf 'exit=%s\n' "$?"
          printf '%s\n' '--stdout--'; head -c 300 o1.txt
          printf '%s\n' '--stderr--'; head -c 400 e1.txt
      - name: public catalog probe
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 15 https://opencode.ai/zen/v1/models -o /tmp/public-models.json || true
          test ! -e /tmp/public-models.json || head -c 200 /tmp/public-models.json
          printf '\n'
          curl --fail --silent --show-error --max-time 15 https://models.dev/api.json -o /tmp/public-models-dev.json || true
