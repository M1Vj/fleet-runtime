name: fleet-deep
run-name: "fleet deep ${{ github.run_id }}"

on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "max parallel public workers"
        type: number
        default: 6

concurrency:
  group: fleet-deep-public
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    env:
      FLEET_DATA_CLASS: public
      FLEET_PUBLIC_OWNER: M1Vj
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${FLEET_PUBLIC_TARGET:-${GITHUB_REPOSITORY}}"
          [[ "$target" == */* && "$target" != *$'\n'* && "$target" != *$'\r'* ]]
          owner="${target%%/*}"
          name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          error_log="$RUNNER_TEMP/public-target-error.log"
          curl --fail --silent --show-error --location --retry 1 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$error_log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (metadata.private !== false || metadata.visibility !== "public" || metadata.owner?.login !== process.env.FLEET_PUBLIC_OWNER || metadata.archived === true) {
            process.exit(1);
          }
          NODE
          printf 'repository=%s\n' "$target" >>"$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: sanitize workers input
        env:
          FLEET_WORKERS_INPUT: ${{ inputs.workers || 6 }}
        run: |
          FLEET_MAX_WORKERS=$(node --input-type=module <<'NODE'
          import { sanitizeMaxWorkers } from "./scripts/deep.mjs";
          process.stdout.write(String(sanitizeMaxWorkers(process.env.FLEET_WORKERS_INPUT)));
          NODE
          )
          printf 'FLEET_MAX_WORKERS=%s\n' "$FLEET_MAX_WORKERS" >> "$GITHUB_ENV"
      - name: plan public tasks
        id: plan
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_DEEP_MODE: plan
        run: node scripts/deep.mjs >> "$GITHUB_OUTPUT"

  analyze:
    needs: plan
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FLEET_DATA_CLASS: public
      FLEET_PUBLIC_OWNER: M1Vj
      GH_TOKEN: ${{ github.token }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      FLEET_REPO: ${{ matrix.worker.repo || matrix.repo }}
      FLEET_KIND: ${{ matrix.worker.kind || matrix.kind }}
      FLEET_TASK_ID: ${{ matrix.worker.taskId || matrix.taskId }}
      FLEET_CLAIM_RUN_ID: ${{ matrix.worker.claimRunId || matrix.claimRunId }}
      FLEET_CLAIM_ATTEMPT: ${{ matrix.worker.claimAttempt || matrix.claimAttempt }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ matrix.worker.repo || matrix.repo || github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${FLEET_PUBLIC_TARGET:-${GITHUB_REPOSITORY}}"
          [[ "$target" == */* && "$target" != *$'\n'* && "$target" != *$'\r'* ]]
          owner="${target%%/*}"
          name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          error_log="$RUNNER_TEMP/public-target-error.log"
          curl --fail --silent --show-error --location --retry 1 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$error_log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (metadata.private !== false || metadata.visibility !== "public" || metadata.owner?.login !== process.env.FLEET_PUBLIC_OWNER || metadata.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >>"$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: analyze public task
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-artifacts
        run: node scripts/deep.mjs
      - name: upload public result manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-result
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  commit:
    needs: [plan, analyze]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLEET_DATA_CLASS: public
      FLEET_PUBLIC_OWNER: M1Vj
      GH_TOKEN: ${{ github.token }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
      FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      FLEET_ANALYZE_RESULT: ${{ needs.analyze.result }}
      FLEET_PLAN_MATRIX: ${{ needs.plan.outputs.matrix }}
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"
          owner="${target%%/*}"
          name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          error_log="$RUNNER_TEMP/public-target-error.log"
          curl --fail --silent --show-error --location --retry 1 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$error_log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (metadata.private !== false || metadata.visibility !== "public" || metadata.owner?.login !== process.env.FLEET_PUBLIC_OWNER || metadata.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >>"$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: download public result manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-result
          path: ${{ runner.temp }}/public-result-download
        continue-on-error: true
      - name: commit public result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-state
          FLEET_DEEP_MODE: commit
        run: node scripts/deep.mjs
