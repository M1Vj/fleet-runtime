name: fleet-retro
run-name: "fleet retro ${{ github.run_id }}"

on:
  schedule:
    - cron: "19 5 * * *"
  workflow_dispatch:

concurrency:
  group: fleet-retro
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_OPENCODE_AUTH: ${{ secrets.FLEET_OPENCODE_AUTH }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
      FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: retrospective sub-agent
        run: FLEET_RETRO_MODE=propose node scripts/retro.mjs
      - name: status digest
        if: ${{ always() }}
        run: node scripts/status.mjs
