name: fleet-merge-gate
run-name: "merge gate ${{ github.event.inputs.repo || 'scan' }}#${{ github.event.inputs.pr || '' }}"

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "target repo (owner/name); empty = scan all open fleet PRs"
        type: string
        default: ""
      pr:
        description: "PR number (requires repo)"
        type: string
        default: ""
      routes:
        description: "UI routes to verify, comma separated"
        type: string
        default: "/"

permissions:
  contents: read

concurrency:
  group: fleet-merge-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      FLEET_OPENCODE_AUTH: ${{ secrets.FLEET_OPENCODE_AUTH }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      FLEET_UI_ROUTES: ${{ github.event.inputs.routes || '/' }}
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: install visual toolchain
        run: |
          npm install -g playwright@1.54.0 pngjs pixelmatch
          npx --yes playwright@1.54.0 install chromium --with-deps || npx --yes playwright@1.54.0 install chromium
      - name: merge gate
        id: gate
        env:
          FLEET_TARGET_REPO: ${{ github.event.inputs.repo }}
          FLEET_PR_NUMBER: ${{ github.event.inputs.pr }}
        run: node scripts/merge.mjs
      - name: autonomous revision
        if: ${{ steps.gate.outputs.revision_needed == 'true' }}
        env:
          FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
          FLEET_OPENCODE_AUTH: ${{ secrets.FLEET_OPENCODE_AUTH }}
          FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
          FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
          OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
          FLEET_REPO: ${{ github.event.inputs.repo }}
          FLEET_PR_NUMBER: ${{ github.event.inputs.pr }}
        run: node scripts/revise.mjs
