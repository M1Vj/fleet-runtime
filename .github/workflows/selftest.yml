name: fleet-selftest
run-name: "fleet selftest ${{ github.run_id }}"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: fleet-selftest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
      FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
      FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
      FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
      FLEET_OPENCODE_DEBUG: "1"
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.21
      - name: selftest
        env:
          # Optional provider slots are step-local and remain empty unless the
          # owner provisions the matching repository secret. Gates stay
          # disabled by default through repository variables.
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_1_EXPIRES_AT: ${{ vars.GEMINI_API_KEY_1_EXPIRES_AT }}
          GEMINI_API_KEY_2_EXPIRES_AT: ${{ vars.GEMINI_API_KEY_2_EXPIRES_AT }}
          GEMINI_API_KEY_3_EXPIRES_AT: ${{ vars.GEMINI_API_KEY_3_EXPIRES_AT }}
          GEMINI_API_KEY_4_EXPIRES_AT: ${{ vars.GEMINI_API_KEY_4_EXPIRES_AT }}
          GEMINI_API_KEY_5_EXPIRES_AT: ${{ vars.GEMINI_API_KEY_5_EXPIRES_AT }}
          GEMINI_API_KEY_6_EXPIRES_AT: ${{ vars.GEMINI_API_KEY_6_EXPIRES_AT }}
          GEMINI_API_KEY_1_QUOTA_GROUP: ${{ vars.GEMINI_API_KEY_1_QUOTA_GROUP }}
          GEMINI_API_KEY_2_QUOTA_GROUP: ${{ vars.GEMINI_API_KEY_2_QUOTA_GROUP }}
          GEMINI_API_KEY_3_QUOTA_GROUP: ${{ vars.GEMINI_API_KEY_3_QUOTA_GROUP }}
          GEMINI_API_KEY_4_QUOTA_GROUP: ${{ vars.GEMINI_API_KEY_4_QUOTA_GROUP }}
          GEMINI_API_KEY_5_QUOTA_GROUP: ${{ vars.GEMINI_API_KEY_5_QUOTA_GROUP }}
          GEMINI_API_KEY_6_QUOTA_GROUP: ${{ vars.GEMINI_API_KEY_6_QUOTA_GROUP }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLEET_NVIDIA_ENABLE: ${{ vars.FLEET_NVIDIA_ENABLE }}
          FLEET_GROQ_ENABLE: ${{ vars.FLEET_GROQ_ENABLE }}
          FLEET_OPENROUTER_ENABLE: ${{ vars.FLEET_OPENROUTER_ENABLE }}
          FLEET_VERCEL_AI_ENABLE: ${{ vars.FLEET_VERCEL_AI_ENABLE }}
          FLEET_CLOUDFLARE_AI_ENABLE: ${{ vars.FLEET_CLOUDFLARE_AI_ENABLE }}
        run: node scripts/selftest.mjs
      - name: dump opencode logs on failure
        if: failure()
        run: tail -n 60 $HOME/.local/share/opencode/log/*.log 2>/dev/null || true
