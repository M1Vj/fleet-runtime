name: fleet-kb
run-name: "fleet public knowledge pass ${{ github.run_id }}"

on:
  schedule:
    - cron: "55 9,21 * * *"
  workflow_dispatch:

concurrency:
  group: fleet-kb-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLEET_DATA_CLASS: public
  FLEET_PUBLIC_OWNER: M1Vj
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
  FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}

jobs:
  inventory:
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${FLEET_PUBLIC_TARGET:-${GITHUB_REPOSITORY}}"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: inventory public target
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_KB_MODE: inventory
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-artifacts
        run: node scripts/kb.mjs
      - name: upload public knowledge manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-knowledge
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  synthesize:
    needs: inventory
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public knowledge manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-knowledge
          path: ${{ runner.temp }}/public-knowledge
        continue-on-error: true
      - name: synthesize public knowledge
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_KB_MODE: synthesize
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/public-knowledge
        run: node scripts/kb.mjs
      - name: upload public synthesis manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-knowledge-synthesis
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  ship:
    needs: [inventory, synthesize]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && needs.synthesize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public synthesis manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-knowledge-synthesis
          path: ${{ runner.temp }}/public-knowledge-synthesis
        continue-on-error: true
      - name: ship public knowledge result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_KB_MODE: ship
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/public-knowledge-synthesis
        run: node scripts/kb.mjs
      - name: upload public shipped manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-knowledge-shipped
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore

  deliver:
    needs: [synthesize, ship]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && always() && needs.synthesize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public shipped manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-knowledge-shipped
          path: ${{ runner.temp }}/public-knowledge-shipped
        continue-on-error: true
      - name: deliver public result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_KB_MODE: deliver
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/public-knowledge-shipped
        run: node scripts/kb.mjs
