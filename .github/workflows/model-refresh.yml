name: fleet-model-refresh
run-name: "fleet public model refresh ${{ github.run_id }}"

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-model-refresh-public
  cancel-in-progress: false

env:
  FLEET_DATA_CLASS: public
  FLEET_PUBLIC_OWNER: M1Vj
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  ZEN_MODELS_URL: https://opencode.ai/zen/v1/models
  FLEET_CHAIN_TTL_MS: ${{ vars.FLEET_CHAIN_TTL_MS || '604800000' }}

jobs:
  refresh:
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: refresh public model catalog
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
        run: node scripts/model-refresh.mjs
      - name: materialize public model manifest
        if: always()
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
        run: |
          if [ -n "${FLEET_PUBLIC_REPOSITORY:-}" ] && [ -f "$FLEET_PUBLIC_STATE_ROOT/state/model-chain.json" ]; then
            node --input-type=module - "$FLEET_PUBLIC_STATE_ROOT/state/model-chain.json" "$FLEET_PUBLIC_ARTIFACT_MANIFEST" "$FLEET_PUBLIC_REPOSITORY" <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";
          import { publicArtifactPayload } from "./scripts/lib/private-state.mjs";

          const [statePath, manifestPath, repository] = process.argv.slice(2);
          const state = JSON.parse(readFileSync(statePath, "utf8"));
          const chain = Array.isArray(state.chain) ? state.chain : [];
          const validChain = chain.length > 0 && chain.length <= 5 && chain.every((id) => typeof id === "string" && id.length <= 200);
          const publicOrigins = new Set(["zen-public", "models-dev-public"]);
          const value = publicArtifactPayload({
            mode: "model-refresh",
            modelMode: publicOrigins.has(state.source) ? state.source : "unknown",
            analyzed: validChain,
            blocked: !validChain,
            count: validChain ? chain.length : 0,
            checks: { model: validChain ? "chain-valid" : "chain-invalid" },
          }, {
            kind: "model-refresh",
            status: validChain ? "ok" : "blocked",
            repository,
          });
          mkdirSync(path.dirname(manifestPath), { recursive: true });
          writeFileSync(manifestPath, JSON.stringify(value, null, 2) + "\n", "utf8");
          NODE
          fi
      - name: publish public model manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-model-chain
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: ignore
