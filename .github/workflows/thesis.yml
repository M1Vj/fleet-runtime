name: fleet-thesis
run-name: "fleet public thesis pass ${{ github.run_id }}"

on:
  schedule:
    - cron: "40 7,15 * * *"
  workflow_dispatch:

concurrency:
  group: fleet-thesis-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLEET_DATA_CLASS: public
  FLEET_PUBLIC_OWNER: M1Vj
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN || '' }}
  FLEET_JUDGE_MODEL: ${{ vars.FLEET_JUDGE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}

jobs:
  survey:
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${FLEET_PUBLIC_TARGET:-${GITHUB_REPOSITORY}}"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$target" == */* && "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: survey public target
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_THESIS_MODE: survey
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/fleet-public-artifacts
        run: node scripts/thesis.mjs
      - name: upload public survey manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-thesis-survey
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: error

  draft:
    needs: survey
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public survey manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-thesis-survey
          path: ${{ runner.temp }}/public-thesis-survey
        continue-on-error: true
      - name: draft public thesis result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_THESIS_MODE: draft
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/public-thesis-survey
        run: node scripts/thesis.mjs
      - name: upload public draft manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-thesis-draft
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: error

  refine:
    needs: [survey, draft]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public draft manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-thesis-draft
          path: ${{ runner.temp }}/public-thesis-draft
        continue-on-error: true
      - name: refine public thesis result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_THESIS_MODE: refine
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/public-thesis-draft
        run: node scripts/thesis.mjs
      - name: upload public final manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-thesis-final
          path: ${{ runner.temp }}/fleet-public-state/public-artifact.json
          if-no-files-found: error

  ship:
    needs: [draft, refine]
    if: ${{ vars.FLEET_PUBLIC_ACTIVATED == 'true' && always() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: validate public target
        id: public-target
        env:
          FLEET_PUBLIC_TARGET: ${{ github.repository }}
          FLEET_PUBLIC_OWNER: M1Vj
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$FLEET_PUBLIC_TARGET"; owner="${target%%/*}"; name="${target#*/}"
          [[ "$owner" == "$FLEET_PUBLIC_OWNER" && "$name" != "$target" && "$name" != */* ]]
          metadata="$RUNNER_TEMP/public-repository.json"
          curl --fail --silent --show-error --location --retry 1 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${owner}/${name}" >"$metadata" 2>"$RUNNER_TEMP/public-target-error.log"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (m.private !== false || m.visibility !== "public" || m.owner?.login !== process.env.FLEET_PUBLIC_OWNER || m.archived === true) process.exit(1);
          NODE
          printf 'repository=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: configure ephemeral public state
        env:
          FLEET_PUBLIC_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_STATE_ROOT: ${{ runner.temp }}/fleet-public-state
          FLEET_PUBLIC_ARTIFACT_MANIFEST: ${{ runner.temp }}/fleet-public-state/public-artifact.json
        run: |
          {
            printf 'FLEET_PUBLIC_STATE_ROOT=%s\n' "$FLEET_PUBLIC_STATE_ROOT"
            printf 'FLEET_STATE_ROOT=%s\n' "$FLEET_STATE_ROOT"
            printf 'FLEET_PUBLIC_ARTIFACT_MANIFEST=%s\n' "$FLEET_PUBLIC_ARTIFACT_MANIFEST"
          } >>"$GITHUB_ENV"
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: checkout public target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.public-target.outputs.repository }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          path: public-target
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned opencode cli
        run: npm install -g opencode-ai@1.18.30
      - name: download public final manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-thesis-final
          path: ${{ runner.temp }}/public-thesis-final
        continue-on-error: true
      - name: ship public thesis result
        env:
          FLEET_PUBLIC_REPOSITORY: ${{ steps.public-target.outputs.repository }}
          FLEET_THESIS_MODE: ship
          FLEET_ARTIFACT_DIR: ${{ runner.temp }}/public-thesis-final
        run: node scripts/thesis.mjs
