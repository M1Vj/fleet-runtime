name: fleet-merge-gate
run-name: fleet merge gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "target repo (M1Vj/name or owner/name)"
        type: string
        required: true
      pr:
        description: "positive pull request number"
        type: string
        required: true
      head_sha:
        description: "mandatory 40-hex pull request head SHA"
        type: string
        required: true
      allow_merge:
        description: "live proof: permit the final REST merge"
        type: boolean
        required: true
        default: false
      dispatch_id:
        description: "scanner correlation key; leave empty for an intentional manual run"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fleet-merge-gate
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      target_found: ${{ steps.discover.outputs.target_found }}
      target_repo: ${{ steps.discover.outputs.target_repo }}
      target_pr: ${{ steps.discover.outputs.target_pr }}
      target_head_sha: ${{ steps.discover.outputs.target_head_sha }}
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: discover one explicit target
        id: discover
        env:
          FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
          FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
          FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
          FLEET_RUN_ID: ${{ github.run_id }}
        run: node scripts/merge.mjs

  authorize:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      repo: ${{ steps.authorize.outputs.target_repo }}
      pr: ${{ steps.authorize.outputs.target_pr }}
      head_sha: ${{ steps.authorize.outputs.target_head_sha }}
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: authorize exact target before checkout
        id: authorize
        env:
          FLEET_AUTHORIZE_ONLY: "true"
          FLEET_RUN_ID: ${{ github.run_id }}
          FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
          FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
          FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
          FLEET_TARGET_REPO: ${{ inputs.repo }}
          FLEET_PR_NUMBER: ${{ inputs.pr }}
          FLEET_HEAD_SHA: ${{ inputs.head_sha }}
          FLEET_DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: node scripts/merge.mjs

  materialize-target:
    needs: authorize
    if: ${{ github.event_name == 'workflow_dispatch' && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      repo: ${{ steps.materialize.outputs.repo }}
      pr: ${{ steps.materialize.outputs.pr }}
      head_sha: ${{ steps.materialize.outputs.head_sha }}
      artifact_name: ${{ steps.materialize.outputs.artifact_name }}
    steps:
      - name: fetch public target at authorized head without credentials
        id: fetch-target
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_REPO: ${{ needs.authorize.outputs.repo }}
          TARGET_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          case "$TARGET_REPO" in
            M1Vj/*) ;;
            *) echo "target repository owner is not normalized" >&2; exit 1 ;;
          esac
          test ! -e "$TARGET_DIR"
          git -c credential.helper= init "$TARGET_DIR"
          git -C "$TARGET_DIR" -c credential.helper= remote add origin "https://github.com/${TARGET_REPO}.git"
          git -C "$TARGET_DIR" -c credential.helper= -c protocol.version=2 fetch --depth=1 --no-tags origin "$TARGET_SHA"
          test "$(git -C "$TARGET_DIR" rev-parse FETCH_HEAD^{commit})" = "$TARGET_SHA"
          git -C "$TARGET_DIR" -c credential.helper= checkout --detach "$TARGET_SHA"
      - name: materialize digest-bound source artifact
        id: materialize
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_REPO: ${{ needs.authorize.outputs.repo }}
          TARGET_PR: ${{ needs.authorize.outputs.pr }}
          TARGET_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -d "$TARGET_DIR"
          if find "$TARGET_DIR" -type l -print -quit | grep -q .; then
            echo "source contains symlink" >&2
            exit 1
          fi
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --exclude='./.git' -czf target-source.tgz -C "$TARGET_DIR" .
          sha256sum target-source.tgz > target-source.sha256
          printf '%s\n' "$TARGET_SHA" > target-source.head-sha
          {
            printf 'repo=%s\n' "$TARGET_REPO"
            printf 'pr=%s\n' "$TARGET_PR"
            printf 'head_sha=%s\n' "$TARGET_SHA"
          } > target-source.meta
          {
            printf 'repo=%s\n' "$TARGET_REPO"
            printf 'pr=%s\n' "$TARGET_PR"
            printf 'head_sha=%s\n' "$TARGET_SHA"
            printf 'artifact_name=target-source-%s\n' "$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: upload digest-bound source artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: target-source-${{ needs.authorize.outputs.head_sha }}
          path: |
            target-source.tgz
            target-source.sha256
            target-source.head-sha
            target-source.meta
          if-no-files-found: error
          retention-days: 1

  target-check:
    needs: materialize-target
    if: ${{ github.event_name == 'workflow_dispatch' && needs.materialize-target.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      check_result: ${{ steps.checks.outcome }}
    steps:
      - name: checkout runtime scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: download digest-bound source artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: target-source-${{ needs.materialize-target.outputs.head_sha }}
          path: source-artifact
      - name: verify and extract exact source digest
        env:
          SOURCE_DIR: ${{ github.workspace }}/source-artifact
          TARGET_SHA: ${{ needs.materialize-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(cat "$SOURCE_DIR/target-source.head-sha")" = "$TARGET_SHA"
          (cd "$SOURCE_DIR" && sha256sum -c target-source.sha256)
          node scripts/lib/archive-safe.mjs "$SOURCE_DIR/target-source.tgz" "$GITHUB_WORKSPACE/target"
          if find target -type l -print -quit | grep -q .; then
            echo "extracted source contains symlink" >&2
            exit 1
          fi
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: load canonical redactor before target execution
        run: |
          node --input-type=module <<'NODE'
          import { redactText } from "./scripts/lib/pr-memory.mjs";
          const text = redactText("canonical-redactor-loaded");
          if (text !== "canonical-redactor-loaded") throw new Error("canonical redactor self-check failed");
          NODE
      - name: run target checks without secrets or private state
        id: checks
        continue-on-error: true
        env:
          FLEET_TARGET_DIR: ${{ github.workspace }}/target
          FLEET_EVIDENCE_PATH: ${{ github.workspace }}/target-check/evidence.txt
          FLEET_HEAD_SHA: ${{ needs.materialize-target.outputs.head_sha }}
          FLEET_PR_NUMBER: ${{ needs.materialize-target.outputs.pr }}
          FLEET_TARGET_REPO: ${{ needs.materialize-target.outputs.repo }}
          MAX_EVIDENCE_CHARS: "8000"
        run: node scripts/pr-check.mjs
      - name: verify target evidence path before upload
        if: ${{ always() }}
        env:
          EVIDENCE_PATH: ${{ github.workspace }}/target-check/evidence.txt
        run: |
          set -euo pipefail
          test -d "$(dirname "$EVIDENCE_PATH")"
          test ! -L "$(dirname "$EVIDENCE_PATH")"
          test -f "$EVIDENCE_PATH"
          test ! -L "$EVIDENCE_PATH"
          test "$(wc -c < "$EVIDENCE_PATH")" -le 8000
      - name: upload raw target evidence for fresh sanitizer
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: target-check-evidence-raw
          path: target-check/evidence.txt
          if-no-files-found: error
          retention-days: 1

  sanitize-evidence:
    needs: [authorize, target-check]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.authorize.result == 'success' && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout trusted sanitizer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: download untrusted evidence artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: target-check-evidence-raw
          path: evidence-input
        continue-on-error: true
      - name: sanitize evidence in fresh trusted context
        env:
          EVIDENCE_INPUT: ${{ github.workspace }}/evidence-input/evidence.txt
          EVIDENCE_OUTPUT: ${{ github.workspace }}/target-check/evidence.txt
          MAX_EVIDENCE_CHARS: "8000"
        run: node scripts/sanitize-evidence.mjs
      - name: upload canonical target evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: target-check-evidence
          path: target-check/evidence.txt
          if-no-files-found: error
          retention-days: 1

  gate:
    needs: [authorize, target-check, sanitize-evidence]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.authorize.result == 'success' && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: install pinned judge cli
        run: npm install -g opencode-ai@1.18.21
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: download untrusted target evidence
        if: ${{ always() }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: target-check-evidence
          path: target-check
        continue-on-error: true
      - name: merge gate
        id: gate
        env:
          FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
          FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
          FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
          FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
          FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
          OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
          FLEET_TARGET_REPO: ${{ needs.authorize.outputs.repo }}
          FLEET_PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          FLEET_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          FLEET_DISPATCH_ID: ${{ inputs.dispatch_id }}
          FLEET_ALLOW_MERGE: ${{ inputs.allow_merge }}
          FLEET_TARGET_CHECK_RESULT: ${{ needs.target-check.outputs.check_result }}
          FLEET_EVIDENCE_PATH: ${{ github.workspace }}/target-check/evidence.txt
        run: node scripts/merge.mjs
      - name: autonomous revision
        if: ${{ github.event_name == 'workflow_dispatch' && needs.authorize.result == 'success' && needs.authorize.outputs.repo != '' && needs.authorize.outputs.pr != '' && needs.authorize.outputs.head_sha != '' && steps.gate.outputs.revision_needed == 'true' }}
        env:
          FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_KEY_2: ${{ secrets.OPENCODE_API_KEY_2 }}
          FLEET_MODEL_CHAIN: ${{ vars.FLEET_MODEL_CHAIN }}
          FLEET_MODEL_BUCKET: ${{ vars.FLEET_MODEL_BUCKET }}
          FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
          FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
          OPENCODE_MODELS_URL: file://${{ github.workspace }}/config/models.json
          FLEET_REPO: ${{ needs.authorize.outputs.repo }}
          FLEET_PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          FLEET_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          FLEET_DISPATCH_ID: ${{ inputs.dispatch_id }}
          FLEET_EVIDENCE_PATH: ${{ github.workspace }}/target-check/evidence.txt
        run: node scripts/revise.mjs

  finalize-setup-failure:
    needs: [authorize, gate]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.gate.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: checkout private state repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: M1Vj/fleet-control
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: state-control
      - name: release consumed claim when setup failed before any gate state
        env:
          FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
          FLEET_STATE_ROOT: ${{ github.workspace }}/state-control
          FLEET_KILL_SWITCH_PATH: ${{ github.workspace }}/state-control/state/KILL_SWITCH
          FLEET_TARGET_REPO: ${{ needs.authorize.outputs.repo }}
          FLEET_PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          FLEET_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          FLEET_DISPATCH_ID: ${{ inputs.dispatch_id }}
          FLEET_ALLOW_MERGE: ${{ inputs.allow_merge }}
          FLEET_RUN_ID: ${{ github.run_id }}
        run: node scripts/merge-finalize.mjs
